name: Integrate MOD clock hook
on:
  push:
    branches: [upstream-180-mod-ci-staging]
    paths: [.github/workflows/mod-clock-hook-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream-180-mod-ci-staging
          persist-credentials: true
      - name: Apply exact clock hook replacement
        shell: python
        run: |
          from pathlib import Path
          path = Path('hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          source = path.read_text()
          old = '''import java.time.LocalDateTime
import java.time.format.DateTimeFormatter
'''
          assert source.count(old) == 1, 'Unexpected clock imports'
          source = source.replace(old, 'import io.github.soclear.oneuix.hook.util.StatusBarClockFormatSupport\n', 1)
          old = '''        val dateTimeFormatter = try {
            DateTimeFormatter.ofPattern(format)
        } catch (_: Throwable) {
            DateTimeFormatter.ofPattern("HH:mm")
        }
        setStatusBarClockText {
            dateTimeFormatter.format(LocalDateTime.now())
        }'''
          assert source.count(old) == 1, 'Clock hook differs from reviewed source'
          source = source.replace(old, '        setStatusBarClockText { StatusBarClockFormatSupport.format(format) }', 1)
          path.write_text(source)
      - name: Commit exact source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          git commit -m 'feat: wire MOD clock formatter into SystemUI hook'
          git push origin HEAD:upstream-180-mod-ci-staging