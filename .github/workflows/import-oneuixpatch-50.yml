name: Import OneUIXpatch #50 modifications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download #50 patch script
        run: |
          curl -fsSL https://raw.githubusercontent.com/iSkyJIE/OneUIXpatch/cfd35c1e4432d6e4ae87fd5fd5aeecf8e31055c1/timeperiod_patch.py -o /tmp/timeperiod_patch.py
          sed -i 's/ROOT = Path("source")/ROOT = Path(".")/' /tmp/timeperiod_patch.py

      - name: Apply #50 modifications to complete source
        run: python3 /tmp/timeperiod_patch.py

      - name: Show changed files
        run: git status --short && git diff --stat

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import OneUIXpatch #50 double-line clock changes"
            git push
          fi
