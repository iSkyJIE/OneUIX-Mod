name: Build Fold7 StatusBar Contents Real Height v1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Patch StatusBar.kt for real status_bar_contents height
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          marker = '    private fun applyStatusBarVerticalOffset(statusBarView: View) {'
          helper = '''    private fun enforceFold7StatusBarContentsHeight(statusBarView: View) {
        if (!Build.MODEL.startsWith("SM-F966", ignoreCase = true)) return
        val id = statusBarView.resources.getIdentifier(
            "status_bar_contents",
            "id",
            Package.SYSTEMUI,
        )
        if (id == 0) return
        val contents = statusBarView.findViewById<View>(id) ?: return
        val density = contents.resources.displayMetrics.density
        val targetHeight = (74f * density).roundToInt()
        val params = contents.layoutParams ?: return
        if (params.height != targetHeight) {
            params.height = targetHeight
            contents.layoutParams = params
            contents.requestLayout()
        }
    }

'''
          if helper not in s:
              if marker not in s:
                  raise SystemExit('applyStatusBarVerticalOffset marker not found')
              s = s.replace(marker, helper + marker, 1)
          call = '        enforceFold7StatusBarContentsHeight(statusBarView)\n'
          marker2 = '    private fun applyStatusBarVerticalOffset(statusBarView: View) {\n'
          if call not in s:
              s = s.replace(marker2, marker2 + call, 1)
          p.write_text(s)

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${SHORT_SHA}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
