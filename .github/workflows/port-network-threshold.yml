name: Port upstream network threshold settings
on:
  push:
    branches: [TEST]
    paths:
      - '.github/workflows/port-network-threshold.yml'
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TEST
          persist-credentials: true
      - name: Apply guarded settings merge
        run: python3 .github/scripts/port-network-threshold-ui.py
      - name: Commit only settings and translation files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt app/src/main/res/values/strings.xml app/src/main/res/values-zh/strings.xml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'port: connect upstream network threshold settings to MOD preference'
          git push origin HEAD:TEST
