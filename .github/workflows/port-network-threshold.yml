name: Port upstream network threshold
on:
  push:
    branches: [TEST]
    paths:
      - '.github/workflows/port-network-threshold.yml'
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TEST
          persist-credentials: true
      - name: Apply guarded upstream merge
        run: python3 .github/scripts/port-network-threshold.py
      - name: Commit only existing runtime files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/soclear/oneuix/hook/Network.kt app/src/main/java/io/github/soclear/oneuix/hook/Main.kt
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'port: merge upstream network speed threshold into existing MOD hook'
          git push origin HEAD:TEST
