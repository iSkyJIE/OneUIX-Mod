name: Sync upstream threshold translations (one time)
on:
  push:
    paths:
      - .github/workflows/sync-upstream-threshold-translations.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/TEST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TEST
          persist-credentials: true
      - name: Apply only missing upstream translation strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          translations = {
              'fr': ("Seuil d\\'affichage de la vitesse réseau", 'Seuil (Ko/s)'),
              'ko': ('네트워크 속도 표시 임계값', '임계값 (KB/s)'),
              'ru': ('Порог отображения скорости сети', 'Порог (КБ/с)'),
          }
          for lang, (title, label) in translations.items():
              p = Path(f'app/src/main/res/values-{lang}/strings.xml')
              text = p.read_text(encoding='utf-8')
              anchor = next(line for line in text.splitlines(keepends=True) if 'name="showSeparateUpDownNetworkSpeeds_summary"' in line)
              additions = []
              if 'name="networkSpeedThreshold_title"' not in text:
                  additions.append(f'    <string name="networkSpeedThreshold_title">{title}</string>\n')
              if 'name="networkSpeedThreshold_label"' not in text:
                  additions.append(f'    <string name="networkSpeedThreshold_label">{label}</string>\n')
              if additions:
                  assert text.count(anchor) == 1, f'Unexpected anchor in {p}'
                  p.write_text(text.replace(anchor, anchor + ''.join(additions), 1), encoding='utf-8')
                  print(f'{p}: added {len(additions)} upstream strings')
              else:
                  print(f'{p}: already synchronized')
          PY
      - name: Commit translation-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values-fr/strings.xml app/src/main/res/values-ko/strings.xml app/src/main/res/values-ru/strings.xml
          if ! git diff --cached --quiet; then
            git commit -m 'i18n: sync upstream v1.8.0 threshold translations'
            git push origin HEAD:TEST
          fi