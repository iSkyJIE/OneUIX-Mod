name: Diagnose StatusBar Contents Height Timing

on:
  push:
    branches:
      - fix/doubleline-linebox-height
    paths:
      - '.github/workflows/diagnose-doubleline-statusbar-height-timing.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject timing diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          marker = '''        clockTextView.requestLayout()\n        clockTextView.invalidate()'''
          inject = '''        clockTextView.requestLayout()\n        clockTextView.invalidate()\n        clockTextView.post {\n            logStatusBarContentsTiming(clockTextView, "post0")\n            clockTextView.postDelayed({ logStatusBarContentsTiming(clockTextView, "post1") }, 16L)\n            clockTextView.postDelayed({ logStatusBarContentsTiming(clockTextView, "post2") }, 64L)\n            clockTextView.postDelayed({ logStatusBarContentsTiming(clockTextView, "post3") }, 250L)\n        }'''
          if s.count(marker) != 1:
              raise SystemExit(f'Expected one timing insertion point, found {s.count(marker)}')
          s = s.replace(marker, inject, 1)
          anchor = '''    private fun applyDoubleLineClockText(clockTextView: TextView) {'''
          helper = '''    private fun logStatusBarContentsTiming(clockTextView: TextView, tag: String) {\n        try {\n            var v: View? = clockTextView\n            var depth = 0\n            while (v != null && depth < 6) {\n                val idName = try {\n                    if (v.id != View.NO_ID) v.resources.getResourceName(v.id) else "NO_ID"\n                } catch (_: Throwable) { "id=${v.id}" }\n                val lp = v.layoutParams\n                XposedBridge.log(\n                    "[OneUIX-TIMING] tag=$tag depth=$depth class=${v.javaClass.name},id=$idName," +\n                        "lp=${lp?.width}x${lp?.height},measured=${v.measuredWidth}x${v.measuredHeight},size=${v.width}x${v.height}," +\n                        "top=${v.top},bottom=${v.bottom},y=${v.y}"\n                )\n                v = v.parent as? View\n                depth++\n            }\n        } catch (t: Throwable) {\n            XposedBridge.log("[OneUIX-TIMING] failed tag=$tag: $t")\n        }\n    }\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one helper anchor, found {s.count(anchor)}')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)
          PY
          git diff --check

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Get Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "OneUIX-Debug-statusbar-timing-Run${{ github.run_number }}-${{ steps.sha.outputs.short_sha }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneUIX-Debug-statusbar-timing-Run${{ github.run_number }}-${{ steps.sha.outputs.short_sha }}
          path: OneUIX-Debug-statusbar-timing-Run${{ github.run_number }}-${{ steps.sha.outputs.short_sha }}.apk
          retention-days: 90