name: Verify upgrade certificate against production release

on:
  push:
    branches:
      - upgrade/from-main-upstream-180-20260922
    paths:
      - .github/workflows/verify-production-signing.yml

permissions:
  contents: read

jobs:
  cert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Download verified production v1.0.0 release and report its public certificate
        run: |
          set -euo pipefail
          RELEASE=https://github.com/iSkyJIE/OneUIX-Mod/releases/download/v1.0.0/OneUIX-Mod_v1.0.0.apk
          curl --fail --location --retry 3 --silent --show-error "$RELEASE" --output production.apk
          test -s production.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs production.apk | grep -E 'Verified using v2 scheme|certificate SHA-256 digest:'
          echo "Production APK SHA256: $(sha256sum production.apk | cut -d' ' -f1)"
      - name: Build with the existing MOD release signing secrets if available
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo '::error::MOD signing secrets unavailable. No installation candidate may be issued.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest assembleDebug --no-daemon
      - name: Check upgrade certificate and package against production
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          PROD_CERT=$("$APKSIGNER" verify --print-certs production.apk | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          TEST_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          echo "Production certificate: $PROD_CERT"
          echo "New test certificate: $TEST_CERT"
          test -n "$PROD_CERT"
          test "$PROD_CERT" = "$TEST_CERT"
          "$AAPT" dump badging "$APK" | head -n 1 | grep -F "name='io.github.mod.oneuix'"
          echo 'PRODUCTION_CERTIFICATE_MATCH=true'
      - name: Upload signed APK for controlled device verification
        uses: actions/upload-artifact@v7
        with:
          name: MAIN-DERIVED-MOD-PRODUCTION-SIGNED-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          archive: false
