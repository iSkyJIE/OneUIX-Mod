name: Verify official-main MOD upgrade

on:
  push:
    branches:
      - upgrade/from-main-upstream-180-20260922
    paths:
      - .github/workflows/verify-main-first-migration.yml
      - app/src/main/java/io/github/soclear/oneuix/ui/PreferenceSerializer.kt
      - app/src/test/**
      - common/src/main/java/io/github/soclear/oneuix/common/ProductionPreferenceMigration.kt
      - hook/src/main/java/io/github/soclear/oneuix/hook/systemui/OfficialMainStatusBarMod.kt

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Confirm production provenance and source contracts
        run: |
          set -euo pipefail
          MAIN=92312ebcfe7ab36cf18a55e90af8a0f5dfebb314
          UPSTREAM=8c67e23118a91b3defd04147b88f32be689e24b1
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor "$UPSTREAM" HEAD
          grep -Fx 'oneuix.applicationId=io.github.mod.oneuix' gradle.properties
          grep -F 'DoubleLineClockStyle(0.82f, 0.76f, 0.66f, -0.65f)' hook/src/main/java/io/github/soclear/oneuix/hook/systemui/OfficialMainStatusBarMod.kt
          grep -F 'Build.MODEL.startsWith("SM-F966", ignoreCase = true)' hook/src/main/java/io/github/soclear/oneuix/hook/systemui/OfficialMainStatusBarMod.kt
          git diff --check "$MAIN" HEAD
      - name: Compile and run migration and shared-unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :common:testDebugUnitTest assembleDebug --no-daemon
      - name: Inspect debug APK identity and signing certificate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | head -n 1 | grep -F "name='io.github.mod.oneuix'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | grep -E 'Verified|certificate SHA-256 digest:'
      - name: Upload non-acceptance diagnostic APK
        uses: actions/upload-artifact@v7
        with:
          name: MAIN-FIRST-MOD-MIGRATION-COMPILE-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          archive: false
