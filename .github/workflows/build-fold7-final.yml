name: Build Fold7 Final Test

on:
  push:
    branches:
      - test/fold7-doubleline-clean-20260829

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply only verified Fold7 default fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          old = 'fold7DateScale.coerceIn(0.50f, 1.10f)\n            } else 0.80f'
          new = 'fold7DateScale.coerceIn(0.50f, 1.10f)\n            } else 1.00f'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY

      - name: Verify final Fold7 source and protected content
        run: |
          grep -F 'fold7TimeScale.coerceIn(0.50f, 1.10f)' app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -F 'fold7DateScale.coerceIn(0.50f, 1.10f)' app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -F 'return DoubleLineClockStyle(timeScale, dateScale, 0.66f, -0.85f)' app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -F 'valueRange = 0.50f..1.10f' app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt
          grep -F 'fold7DoubleLineClockTimeScale: Float = 1f' app/src/main/java/io/github/soclear/oneuix/data/Preference.kt
          grep -F 'fold7DoubleLineClockDateScale: Float = 1f' app/src/main/java/io/github/soclear/oneuix/data/Preference.kt
          test ! -e .github/workflows/import-oneuixpatch-50.yml

      - name: Build Debug APK from this exact workspace
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OneUIX-Fold7-Final-${GITHUB_SHA::7}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-Fold7-Final-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/OneUIX-Fold7-Final-*.apk
          retention-days: 15
          archive: false

      - name: Commit exact source fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt .github/workflows/build-fold7-final.yml
          git commit -m 'fix: set Fold7 default second-line scale to 1.00' || exit 0
          git rm .github/workflows/build-fold7-final.yml
          git commit -m 'chore: remove temporary Fold7 final build workflow'
          git push
