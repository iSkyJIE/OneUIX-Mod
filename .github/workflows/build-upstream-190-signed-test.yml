name: Build signed upstream 1.9.0 sync test

on:
  push:
    branches:
      - upgrade/upstream-1.9.0-20260924
    paths:
      - .github/workflows/build-upstream-190-signed-test.yml
      - .github/workflows/release.yml
      - app/build.gradle.kts
      - app/src/main/res/**
      - app/src/main/java/**
      - app/src/test/**
      - common/src/main/**
      - hook/src/main/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Verify production base, upstream ancestry and MOD identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3b293ce63ec110e3bd42106d41eb1c38a73249ef HEAD
          git merge-base --is-ancestor 4adebea56d00369dc6cd51c2718d44b16120551d HEAD
          grep -Fx 'oneuix.applicationId=io.github.mod.oneuix' gradle.properties
          grep -Fx '        versionCode = 3' app/build.gradle.kts
          grep -Fx '        versionName = "1.2.0"' app/build.gradle.kts
          for resource in app/src/main/res/values{,-zh,-fr,-ru,-ko}/strings.xml; do
            grep -F '<string name="app_name">OneUIX MOD</string>' "$resource"
          done
          grep -F 'object OfficialMainStatusBarMod' hook/src/main/java/io/github/soclear/oneuix/hook/systemui/OfficialMainStatusBarMod.kt
          grep -F 'StatusBarClockFormatter.format' hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -F 'fun afterAttachTry' hook/src/main/java/io/github/soclear/oneuix/hook/util/Util.kt
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/iSkyJIE/OneUIX-Mod/releases/download/v1.1.0/OneUIX-Mod_v1.1.0.apk \
            --output production.apk
          test -s production.apk
      - name: Install existing MOD signing identity and build signed release test
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :common:testDebugUnitTest assembleRelease --no-daemon
      - name: Verify certificate, package, branding and test identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          PROD_CERT=$("$APKSIGNER" verify --print-certs production.apk | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          test -n "$PROD_CERT"
          test "$PROD_CERT" = "$NEW_CERT"
          test "$NEW_CERT" = '3cca67360758a4956796fcf6d8c726daf92b581532a1bb7e81211c8107bc7e09'
          PROD_BADGING=$("$AAPT" dump badging production.apk | head -n 1)
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | head -n 1 | grep -F "name='io.github.mod.oneuix' versionCode='3' versionName='1.2.0'"
          echo "$BADGING" | grep -F "application-label:'OneUIX MOD'"
          for locale in zh fr ko ru; do
            echo "$BADGING" | grep -F "application-label-${locale}:'OneUIX MOD'"
          done
          PROD_VERSION=$(printf '%s' "$PROD_BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          test "$PROD_VERSION" = '2'
          cp "$APK" app/build/outputs/apk/release/OneUIX-Mod_v1.2.0_upstream-1.9.0_SIGNED_TEST.apk
      - name: Upload signed nonpublished test APK
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-Mod_v1.2.0_upstream-1.9.0_SIGNED_TEST
          path: app/build/outputs/apk/release/OneUIX-Mod_v1.2.0_upstream-1.9.0_SIGNED_TEST.apk
          retention-days: 7
          archive: false
