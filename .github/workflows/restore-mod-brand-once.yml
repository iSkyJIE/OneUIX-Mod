name: Restore original MOD app labels once
on:
  push:
    branches:
      - upstream-180-mod-ci-staging
    paths:
      - .github/workflows/restore-mod-brand-once.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore only app_name entries without overwriting translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          labels = {'values': 'OneUIX Mod', 'values-zh': 'OneUIX iSky'}
          for locale, original in labels.items():
              path = Path(f'app/src/main/res/{locale}/strings.xml')
              text = path.read_text(encoding='utf-8')
              old = '<string name="app_name">One UI X</string>'
              new = f'<string name="app_name">{original}</string>'
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected app label in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values/strings.xml app/src/main/res/values-zh/strings.xml
          git diff --cached --check
          git commit -m 'fix(mod): restore original English and Chinese app names'
          git push origin HEAD:upstream-180-mod-ci-staging
