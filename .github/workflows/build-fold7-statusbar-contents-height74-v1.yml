name: Build Fold7 status_bar_contents 74px A-B

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply Fold7 74px A-B patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()

          old = '''    private fun applyStatusBarVerticalOffset(statusBarView: View) {\n        val offset = statusBarVerticalOffset'''
          new = '''    private fun applyStatusBarVerticalOffset(statusBarView: View) {\n        // Fold7 A/B: enlarge the actual status_bar_contents viewport to 74px.\n        if (Build.MODEL.startsWith("SM-F966", ignoreCase = true)) {\n            statusBarView.findStatusBarArea("status_bar_contents")?.let { contents ->\n                contents.layoutParams = contents.layoutParams.apply { height = 74 }\n                contents.requestLayout()\n            }\n        }\n        val offset = statusBarVerticalOffset'''
          if s.count(old) != 1:
              raise SystemExit(f'applyStatusBarVerticalOffset anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old_h = 'params.height = ViewGroup.LayoutParams.MATCH_PARENT'
          if s.count(old_h) != 1:
              raise SystemExit(f'clock height anchor count={s.count(old_h)}')
          s = s.replace(old_h, 'params.height = 74', 1)

          old_t = 'clockTextView.translationY = doubleLineClockStyle.opticalTranslationYDp * density'
          if s.count(old_t) != 1:
              raise SystemExit(f'clock translation anchor count={s.count(old_t)}')
          s = s.replace(old_t, 'clockTextView.translationY = 0f', 1)

          p.write_text(s)
          PY

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-fold7-statusbar-contents-height74-Run${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
