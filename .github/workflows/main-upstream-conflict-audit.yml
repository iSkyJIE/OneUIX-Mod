name: Audit verified main against latest upstream without merging

on:
  push:
    branches:
      - upgrade/from-main-upstream-180-20260922
    paths:
      - .github/workflows/main-upstream-conflict-audit.yml

permissions:
  contents: read

jobs:
  conflict-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/from-main-upstream-180-20260922
          fetch-depth: 0
      - name: Confirm official MOD main baseline and upstream latest
        run: |
          set -eu
          EXPECTED_MAIN=92312ebcfe7ab36cf18a55e90af8a0f5dfebb314
          EXPECTED_UPSTREAM=7aa73a036e066e79e6e2306256229dbe9f88dbb1
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          git remote add upstream https://github.com/SoClear/OneUIX.git
          git fetch --no-tags upstream main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_UPSTREAM"
          echo "Verified MOD main: $EXPECTED_MAIN"
          echo "Verified upstream main: $EXPECTED_UPSTREAM"
      - name: Dry-run merge and collect unresolved path inventory
        run: |
          set -u
          RESULT=0
          git -c user.name='OneUIX audit' -c user.email='audit@users.noreply.github.com' merge --no-commit --no-ff --no-edit upstream/main > /tmp/merge-output.log 2>&1 || RESULT=$?
          echo "DRY_RUN_MERGE_EXIT_CODE=$RESULT"
          echo '===== MERGE OUTPUT ====='
          cat /tmp/merge-output.log
          echo '===== UNMERGED FILES (must preserve verified main customizations) ====='
          git diff --name-only --diff-filter=U | tee /tmp/unmerged-files.txt
          echo '===== UNMERGED PATH COUNT ====='
          wc -l /tmp/unmerged-files.txt
          echo '===== WORKTREE CHANGES BEFORE ABORT ====='
          git status --short | head -200
          git merge --abort || true
          echo '===== CLEANUP RESULT ====='
          git status --short
          echo 'Dry-run complete. Neither MOD main nor the audit branch has been merged or modified by this job.'
