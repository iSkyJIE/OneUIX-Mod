name: Test DoubleLine Original TextView Height

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-doubleline-original-height.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply single-variable height experiment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          old = '''        clockTextView.layoutParams?.let { params
            params.height = ViewGroup.LayoutParams.MATCH_PARENT
            clockTextView.layoutParams = params
        }
'''
          new = '''        // Height experiment: preserve the original TextView height.
'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target height block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-original-height-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
