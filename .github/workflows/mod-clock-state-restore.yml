name: Restore MOD clock view state
on:
  push:
    paths:
      - '.github/workflows/mod-clock-state-restore.yml'
permissions:
  contents: write
jobs:
  restore:
    if: github.ref_name == 'upstream-180-mod-ci-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Apply clock state patch
        run: python3 .github/scripts/restore_clock_state.py
      - name: Commit patch
        run: |
          git diff --check
          git add hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(systemui): restore original clock view state'
          git push
