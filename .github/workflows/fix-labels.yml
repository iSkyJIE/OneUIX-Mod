name: Fix label branch

on:
  push:
    branches:
      - feature/rename-double-line-text-settings-clean

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore and apply exact label changes
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          subprocess.run(["git", "fetch", "origin", "main"], check=True)
          files = [
              "app/src/main/res/values/strings.xml",
              "app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt",
          ]
          for path in files:
              data = subprocess.check_output(["git", "show", f"origin/main:{path}"])
              Path(path).write_bytes(data)

          p = Path("app/src/main/res/values/strings.xml")
          s = p.read_text()
          s = s.replace(
              "<string name=\"fold7CustomDoubleLineClockScale_title\">Use Fold7 custom double-line sizes</string>",
              "<string name=\"fold7CustomDoubleLineClockScale_title\">Use custom double-line text size</string>",
          )
          s = s.replace(
              "    <string name=\"fold7CustomDoubleLineClockScale_summary\">Default: time 1.00×, date 0.80×. Fold7 only; changes apply immediately.</string>\n",
              "",
          )
          s = s.replace(
              "<string name=\"fold7DoubleLineClockTimeScale_title\">Fold7 time scale</string>",
              "<string name=\"fold7DoubleLineClockTimeScale_title\">Upper text scale</string>",
          )
          s = s.replace(
              "<string name=\"fold7DoubleLineClockDateScale_title\">Fold7 date scale</string>",
              "<string name=\"fold7DoubleLineClockDateScale_title\">Lower text scale</string>",
          )
          p.write_text(s)

          p = Path("app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt")
          s = p.read_text()
          s = s.replace(
              "                        summary = stringResource(\n                            id = R.string.fold7CustomDoubleLineClockScale_summary\n                        ),\n",
              "",
          )
          p.write_text(s)

          Path(".github/workflows/fix-labels.yml").unlink()

      - name: Commit exact changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values/strings.xml app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt .github/workflows/fix-labels.yml
          git commit -m "Fix exact double-line settings label changes"
          git push origin HEAD:feature/rename-double-line-text-settings-clean
