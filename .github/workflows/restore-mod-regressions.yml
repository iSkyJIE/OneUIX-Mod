name: Restore MOD regressions (one shot)
on:
  push:
    branches:
      - upstream-180-mod-ci-staging
    paths:
      - .github/workflows/restore-mod-regressions.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Disambiguate top margin among the two historical controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/restore_mod_regressions.py')
          s = p.read_text()
          old = "legacy_controls = section(old_ui, '        StatusBarVerticalPaddingControl(\\n',"
          new = "legacy_controls = section(old_ui, '        StatusBarVerticalPaddingControl(\\n            title = stringResource(id = R.string.statusBarTopPaddingDp_title),',"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Restore MOD features with guarded source comparison
        run: python3 scripts/restore_mod_regressions.py
      - name: Commit only the restored source files on staging
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt app/src/main/res/values/strings.xml app/src/main/res/values-zh/strings.xml common/src/main/java/io/github/soclear/oneuix/common/Preference.kt hook/src/main/java/io/github/soclear/oneuix/hook/Main.kt hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarVerticalPadding.kt
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'fix(mod): restore vertical padding and SystemUI restart result'
          git push origin HEAD:upstream-180-mod-ci-staging
