name: Build Fold7 clipping contents only

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply Fold7 contents-only clipping patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          anchor = '    private fun applyStatusBarVerticalOffset(statusBarView: View) {\n'
          helper = '''    private fun applyFold7ContentsOnlyClippingFix(statusBarView: View) {
        if (!Build.MODEL.startsWith("SM-F966", ignoreCase = true)) return
        val contents = statusBarView.findStatusBarArea("status_bar_contents")
        (contents as? ViewGroup)?.let {
            it.clipChildren = false
            it.clipToPadding = false
        }
        contents?.let {
            val params = it.layoutParams
            if (params != null) {
                val density = it.resources.displayMetrics.density
                params.height = (74f * density).roundToInt()
                it.layoutParams = params
            }
        }
    }

'''
          if anchor not in s:
              raise SystemExit('anchor not found')
          if 'private fun applyFold7ContentsOnlyClippingFix' not in s:
              s = s.replace(anchor, helper + anchor, 1)
          call = '        applyFold7ContentsOnlyClippingFix(statusBarView)\n'
          if call not in s:
              s = s.replace(anchor, anchor + call, 1)
          clock_h = 'params.height = ViewGroup.LayoutParams.MATCH_PARENT'
          if s.count(clock_h) != 1:
              raise SystemExit(f'clock height anchor count={s.count(clock_h)}')
          s = s.replace(clock_h, 'params.height = 74', 1)
          clock_t = 'clockTextView.translationY = doubleLineClockStyle.opticalTranslationYDp * density'
          if s.count(clock_t) != 1:
              raise SystemExit(f'clock translation anchor count={s.count(clock_t)}')
          s = s.replace(clock_t, 'clockTextView.translationY = 0f', 1)
          p.write_text(s)
          PY

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-fold7-contents-only-Run${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
