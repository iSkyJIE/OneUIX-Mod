name: One-time Fold7 Dynamic Double-Line Center

on:
  push:
    branches:
      - experiment/fold7-dynamic-doubleline-position-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply Fold7 dynamic double-line centering') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch StatusBar.kt
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          text = path.read_text()
          old = '''        clockTextView.setLineSpacing(extraLineGapPx, doubleLineClockStyle.lineSpacing)\n        clockTextView.translationY = 0f\n        clockTextView.text = SpannableString(dateTime).apply {'''
          new = '''        clockTextView.setLineSpacing(extraLineGapPx, doubleLineClockStyle.lineSpacing)\n        // Fold7 dynamic centering: keep the entire two-line text block centered\n        // inside the 74px status-bar viewport after span scaling is laid out.\n        clockTextView.translationY = 0f\n        clockTextView.text = SpannableString(dateTime).apply {'''
          if old not in text:
              raise SystemExit('expected source block not found')
          text = text.replace(old, new, 1)
          old2 = '''        clockTextView.contentDescription = dateTime.replace('\\n', ' ')\n        clockTextView.requestLayout()\n        clockTextView.invalidate()'''
          new2 = '''        clockTextView.contentDescription = dateTime.replace('\\n', ' ')\n        clockTextView.requestLayout()\n        clockTextView.post {\n            val layout = clockTextView.layout ?: return@post\n            val viewportHeightPx = clockTextView.height.takeIf { it > 0 } ?: 74\n            val centeredOffsetPx = (viewportHeightPx - layout.height) / 2f\n            val opticalOffsetPx = doubleLineClockStyle.opticalTranslationYDp * density\n            clockTextView.translationY = centeredOffsetPx + opticalOffsetPx\n        }\n        clockTextView.invalidate()'''
          if old2 not in text:
              raise SystemExit('expected layout block not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text)
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          git commit -m "test: apply Fold7 dynamic double-line centering"
          git push