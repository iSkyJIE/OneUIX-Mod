name: CI

# 触发条件：所有分支的 push 和 PR 都会触发
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Experimental Fold7 test: keep the native status_bar_contents viewport,
      # and make only the double-line Clock viewport adaptive to its actual text.
      - name: Make Fold7 double-line Clock height adaptive
        if: github.ref_name == 'exp/remove-fold7-statusbar-contents-height'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          text = path.read_text(encoding='utf-8')

          old_container = '''        // Fold7 A/B: enlarge the actual status_bar_contents viewport to 74px.\n        if (Build.MODEL.startsWith("SM-F966", ignoreCase = true)) {\n            statusBarView.findStatusBarArea("status_bar_contents")?.let { contents ->\n                contents.layoutParams = contents.layoutParams.apply { height = 74 }\n                contents.requestLayout()\n            }\n        }\n'''
          if old_container in text:
              text = text.replace(old_container, '', 1)
          elif 'status_bar_contents")?.let { contents ->' in text and 'height = 74' in text:
              raise SystemExit('Unexpected status_bar_contents height override found; refusing to build')

          old_clock = '''        clockTextView.layoutParams?.let { params ->\n            params.height = 74\n            clockTextView.layoutParams = params\n        }\n'''
          new_clock = '''        // Fold7: do not cap the double-line Clock at 74px. With larger user-selected\n        // time/date scales, the two-line text can legitimately need more vertical space.\n        // WRAP_CONTENT lets the TextView grow to the actual two-line layout, while the\n        // existing layout listener continues to center that complete block dynamically.\n        clockTextView.layoutParams?.let { params ->\n            params.height = ViewGroup.LayoutParams.WRAP_CONTENT\n            clockTextView.layoutParams = params\n        }\n'''
          if old_clock not in text:
              raise SystemExit('Expected Fold7 Clock height=74 block not found; refusing to build')
          text = text.replace(old_clock, new_clock, 1)

          if 'status_bar_contents")?.let { contents ->' in text and 'height = 74' in text:
              raise SystemExit('status_bar_contents height override still present')
          if 'params.height = 74' in text:
              raise SystemExit('Clock height=74 override still present')

          path.write_text(text, encoding='utf-8')
          print('Verified: native status_bar_contents height preserved; double-line Clock height is WRAP_CONTENT')
          PY

      # 获取当前 commit 的前 7 位短 Hash，并存入环境变量 SHORT_SHA 中
      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 构建 Debug 包
      - name: Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 重命名 Debug 包
      - name: Rename APK
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"

      # 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
