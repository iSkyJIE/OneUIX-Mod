name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 1: remove only the Fold7 parent status_bar_contents height=74 override.
      - name: Remove Fold7 status_bar_contents height override
        if: github.ref_name == 'experiment/fold7-clock90-remove-parent-height'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        // Fold7 A/B: enlarge the actual status_bar_contents viewport to 74px.\n        if (Build.MODEL.startsWith("SM-F966", ignoreCase = true)) {\n            statusBarView.findStatusBarArea("status_bar_contents")?.let { contents ->\n                contents.layoutParams = contents.layoutParams.apply { height = 74 }\n                contents.requestLayout()\n            }\n        }\n'''
          if old not in text:
              raise SystemExit('Expected Fold7 status_bar_contents height override not found; refusing to build')
          text = text.replace(old, '', 1)
          if 'status_bar_contents")?.let { contents ->' in text and 'height = 74' in text:
              raise SystemExit('Fold7 status_bar_contents height override still present')
          path.write_text(text, encoding='utf-8')
          print('OK: Fold7 parent status_bar_contents height=74 override removed')
          PY

      # Preserve Run 326's already-tested Clock 90px change; no other Clock changes here.
      - name: Preserve Fold7 Clock height 90
        if: github.ref_name == 'experiment/fold7-clock90-remove-parent-height'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          text = path.read_text(encoding='utf-8')
          old = '            params.height = 74\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Clock params.height = 74, found {text.count(old)}')
          text = text.replace(old, '            params.height = 90\n', 1)
          path.write_text(text, encoding='utf-8')
          print('OK: Fold7 double-line Clock remains at 90px')
          PY

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
