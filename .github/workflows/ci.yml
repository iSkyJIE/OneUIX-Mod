name: CI

# Fold7 equal-cell test CI
# 触发条件：所有分支的 push 和 PR 都会触发
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Apply CNLUNAR verified patch
        if: github.event_name == 'push' && github.ref_name == 'feature/fold7-double-cell-test' || github.event_name == 'pull_request' && github.head_ref == 'feature/fold7-double-cell-test'
        run: python .github/scripts/apply_cnlunar_verified.py

      - name: Apply Fold7 equal-cell double-line patch
        if: github.event_name == 'push' && github.ref_name == 'feature/fold7-double-cell-test' || github.event_name == 'pull_request' && github.head_ref == 'feature/fold7-double-cell-test'
        run: python .github/scripts/apply_fold7_double_cell.py

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
