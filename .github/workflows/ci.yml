name: CI

# 触发条件：所有分支的 push 和 PR 都会触发
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Apply CNLUNAR test patch
        if: github.ref_name == 'feature/statusbar-cnlunar-test'
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt")
          text = path.read_text(encoding="utf-8")

          if "formatStatusBarClock" in text:
              print("CNLUNAR parser already present")
              raise SystemExit(0)

          imp = "import io.github.soclear.oneuix.hook.util.PreferenceProvider\n"
          new_imp = imp + "import io.github.soclear.oneuix.hook.util.TraditionalChineseCalendar\n"
          if imp not in text:
              raise SystemExit("PreferenceProvider import not found")
          text = text.replace(imp, new_imp, 1)

          marker = "    fun setStatusBarClockFormat(\n"
          helper = r'''    private fun formatStatusBarClock(format: String, now: LocalDateTime): String {
        if (!format.contains("CNLUNAR")) {
            return try {
                DateTimeFormatter.ofPattern(format).format(now)
            } catch (_: Throwable) {
                DateTimeFormatter.ofPattern("HH:mm").format(now)
            }
        }

        val lunarText = TraditionalChineseCalendar.getMonthAndDay(now.toLocalDate())
        return try {
            val parts = format.split("CNLUNAR")
            buildString {
                parts.forEachIndexed { index, part ->
                    if (part.isNotEmpty()) {
                        append(DateTimeFormatter.ofPattern(part).format(now))
                    }
                    if (index < parts.lastIndex) {
                        append(lunarText)
                    }
                }
            }
        } catch (_: Throwable) {
            DateTimeFormatter.ofPattern("HH:mm").format(now)
        }
    }

'''
          if marker not in text:
              raise SystemExit("setStatusBarClockFormat marker not found")
          text = text.replace(marker, helper + marker, 1)

          old = '''        val dateTimeFormatter = try {
            DateTimeFormatter.ofPattern(format)
        } catch (_: Throwable) {
            DateTimeFormatter.ofPattern("HH:mm")
        }
'''
          if old not in text:
              raise SystemExit("dateTimeFormatter block not found")
          text = text.replace(old, "", 1)

          old_call = '''        ) {
            dateTimeFormatter.format(LocalDateTime.now())
        }
'''
          new_call = '''        ) {
            formatStatusBarClock(format, LocalDateTime.now())
        }
'''
          if old_call not in text:
              raise SystemExit("clock formatter call not found")
          text = text.replace(old_call, new_call, 1)

          path.write_text(text, encoding="utf-8")
          print("CNLUNAR test patch applied")

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 获取当前 commit 的前 7 位短 Hash，并存入环境变量 SHORT_SHA 中
      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 构建 Debug 包
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 重命名 Debug 包
      # github.ref_name: 分支名 (例如 main)
      # github.run_number: Actions 的历史运行编号 (例如 15)
      # env.SHORT_SHA: 刚刚获取的 7 位 commit 标识 (例如 a1b2c3d)
      - name: Rename APK
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"

      # 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # name: OneUIX-Debug-${{ github.ref_name }}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
