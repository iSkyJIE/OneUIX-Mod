name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Apply CNLUNAR verified patch
        if: github.ref_name == 'feature/statusbar-cnlunar-test' || github.ref_name == 'feature/isky-brand-test' || github.ref_name == 'feature/fold7-two-textviews' || github.head_ref == 'feature/fold7-two-textviews'
        run: python .github/scripts/apply_cnlunar_verified.py

      - name: Apply Fold7 independent two-TextView clock patch
        if: github.ref_name == 'feature/fold7-two-textviews' || github.head_ref == 'feature/fold7-two-textviews'
        run: python .github/scripts/apply_fold7_two_textviews.py

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
