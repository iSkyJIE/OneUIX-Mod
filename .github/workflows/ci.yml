name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # One-time cleanup: materialize the exact source changes proven by Run 328.
      - name: Materialize verified Fold7 source changes
        if: github.ref_name == 'clean/fold7-run328-source'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          text = path.read_text(encoding='utf-8')
          parent = '''        // Fold7 A/B: enlarge the actual status_bar_contents viewport to 74px.\n        if (Build.MODEL.startsWith("SM-F966", ignoreCase = true)) {\n            statusBarView.findStatusBarArea("status_bar_contents")?.let { contents ->\n                contents.layoutParams = contents.layoutParams.apply { height = 74 }\n                contents.requestLayout()\n            }\n        }\n'''
          if parent in text:
              text = text.replace(parent, '', 1)
          elif 'status_bar_contents")?.let { contents ->' in text and 'height = 74' in text:
              raise SystemExit('Unexpected Fold7 status_bar_contents height override shape; refusing to edit')
          clock = '            params.height = 74\n'
          if clock in text:
              if text.count(clock) != 1:
                  raise SystemExit(f'Expected exactly one Clock params.height = 74, found {text.count(clock)}')
              text = text.replace(clock, '            params.height = 90\n', 1)
          elif '            params.height = 90\n' not in text:
              raise SystemExit('Fold7 Clock height target not found; refusing to edit')
          path.write_text(text, encoding='utf-8')
          print('OK: materialized Run 328 source changes')
          PY

      - name: Commit materialized source
        if: github.ref_name == 'clean/fold7-run328-source'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Source already clean; no commit needed"
          else
            git add app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
            git commit -m "fix: materialize verified Fold7 Run 328 source"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Get Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: |
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-${SAFE_BRANCH_NAME}-Run${{ github.run_number }}-${{ env.SHORT_SHA }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
