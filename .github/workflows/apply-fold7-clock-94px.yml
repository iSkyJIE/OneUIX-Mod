name: Apply Fold7 Clock 94px

on:
  push:
    branches:
      - experiment/fold7-clock-height-94px

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change Clock height 90px to 94px
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          old = 'params.height = 90'
          new = 'params.height = 94'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one occurrence, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          git commit -m 'test: increase Fold7 double-line Clock height to 94px'
          git push
