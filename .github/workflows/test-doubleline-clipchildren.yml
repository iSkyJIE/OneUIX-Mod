name: Test DoubleLine ClipChildren

on:
  push:
    branches:
      - fix/doubleline-linebox-height
    paths:
      - '.github/workflows/test-doubleline-clipchildren.yml'
      - 'app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply single-variable clipChildren experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          old = '(clockTextView.parent as? LinearLayout)?.gravity = Gravity.CENTER_VERTICAL\n'
          new = old + '(clockTextView.parent as? ViewGroup)?.clipChildren = false\n'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {s.count(old)}')
          if '(clockTextView.parent as? ViewGroup)?.clipChildren = false' in s:
              raise SystemExit('Experiment already present in source; refusing duplicate patch')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Get Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "OneUIX-Debug-clipchildren-Run${{ github.run_number }}-${{ steps.sha.outputs.short_sha }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneUIX-Debug-clipchildren-Run${{ github.run_number }}-${{ steps.sha.outputs.short_sha }}
          path: OneUIX-Debug-clipchildren-Run${{ github.run_number }}-${{ steps.sha.outputs.short_sha }}.apk