name: Fix moved MOD resource once
on:
  push:
    branches:
      - upstream-180-mod-ci-staging
    paths:
      - .github/workflows/fix-mod-resource-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Correct unique moved resource reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt')
          text = p.read_text()
          old = 'Text(text = stringResource(R.string.restartSystemUI))'
          new = 'Text(text = stringResource(CommonR.string.restartSystemUI))'
          assert text.count(old) == 1, 'Missing or ambiguous resource reference'
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt
          git commit -m 'fix(mod): use common resource for SystemUI restart label'
          git push origin HEAD:upstream-180-mod-ci-staging
