name: OneUIX Mod Branding Migration

on:
  push:
    branches:
      - cleanup/oneuix-mod-branding-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply non-workflow branding changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "cleanup/oneuix-mod-branding-final"
          sed -i 's/<string name="app_name">OneUIX iSky<\/string>/<string name="app_name">OneUIX Mod<\/string>/' app/src/main/res/values/strings.xml
          rm -f anndy999-doubleline-build.yml
          git diff --check

      - name: Commit non-workflow migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values/strings.xml anndy999-doubleline-build.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'chore: finish OneUIX Mod branding cleanup'
          git push origin HEAD:cleanup/oneuix-mod-branding-final
