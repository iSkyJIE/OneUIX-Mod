name: Remove obsolete upgrade tooling from release candidate once

on:
  push:
    branches:
      - upgrade/from-main-upstream-180-20260922
    paths:
      - .github/workflows/production-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/from-main-upstream-180-20260922
          fetch-depth: 0
      - name: Remove only completed QA and audit helpers; keep tests, MOD hooks and publisher
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge-base --is-ancestor 92312ebcfe7ab36cf18a55e90af8a0f5dfebb314 HEAD
          git merge-base --is-ancestor 748f06f0e28741b2a6df251624f7a59daeb0498f HEAD
          test -f .github/workflows/publish-v1.1.0-on-main-once.yml
          git rm \
            .github/scripts/port_official_main_statusbar.py \
            .github/workflows/main-upstream-conflict-audit.yml \
            .github/workflows/port-main-first-once.yml \
            .github/workflows/verify-main-first-migration.yml \
            .github/workflows/verify-production-signing.yml \
            .github/workflows/build-main-first-release-test.yml \
            .github/workflows/production-cleanup-once.yml
          git diff --cached --name-status
          git commit -m 'chore(release): remove completed migration and QA-only tools'
          git push origin HEAD:refs/heads/upgrade/from-main-upstream-180-20260922
