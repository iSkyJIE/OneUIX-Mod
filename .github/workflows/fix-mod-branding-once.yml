name: One-shot fix MOD app labels on upgrade branch

on:
  push:
    branches:
      - upgrade/from-main-upstream-180-20260922
    paths:
      - .github/workflows/fix-mod-branding-once.yml

permissions:
  contents: write

jobs:
  fix-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve all translations and correct only the app label
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'upgrade/from-main-upstream-180-20260922'
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          names = ('values', 'values-zh', 'values-fr', 'values-ru', 'values-ko')
          for locale in names:
              path = Path('app/src/main/res') / locale / 'strings.xml'
              original = path.read_text(encoding='utf-8')
              result, count = re.subn(r'(<string\s+name="app_name">)[^<]*(</string>)',
                  lambda match: match.group(1) + 'OneUIX MOD' + match.group(2), original)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one app_name, got {count}')
              ET.fromstring(result)
              path.write_text(result, encoding='utf-8')
              print(f'{path}: OneUIX MOD')
          PY
          git diff --check
          git add app/src/main/res/values/strings.xml app/src/main/res/values-zh/strings.xml app/src/main/res/values-fr/strings.xml app/src/main/res/values-ru/strings.xml app/src/main/res/values-ko/strings.xml
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(branding): name app OneUIX MOD in all supported languages'
          git push origin HEAD:refs/heads/upgrade/from-main-upstream-180-20260922
