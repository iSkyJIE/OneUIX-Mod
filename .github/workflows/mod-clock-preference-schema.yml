name: Add MOD double-line clock preference schema
on:
  push:
    paths:
      - '.github/workflows/mod-clock-preference-schema.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref_name == 'upstream-180-mod-ci-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Add backward-compatible preference fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('common/src/main/java/io/github/soclear/oneuix/common/Preference.kt')
          text = p.read_text()
          anchor = '            val statusBarClockTextScale: Float = 1f,\n'
          assert text.count(anchor) == 1, 'Expected exactly one status bar clock scale field'
          additions = '''            val statusBarDoubleLineClockSize: String = "",
            val doubleLineClockGapDp: Float = 0f,
            val useFold7CustomDoubleLineClockScale: Boolean = false,
            val fold7DoubleLineClockTimeScale: Float = 1f,
            val fold7DoubleLineClockDateScale: Float = 1f,
'''
          assert 'val statusBarDoubleLineClockSize:' not in text
          p.write_text(text.replace(anchor, anchor + additions, 1))
          PY
          git diff --check
          git add common/src/main/java/io/github/soclear/oneuix/common/Preference.kt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(common): add backward-compatible double-line clock preference fields'
          git push