name: Test Fold7 Double-Line Scale Patch

on:
  push:
    branches:
      - test/fold7-doubleline-clean-20260829
    paths:
      - .github/workflows/test-fold7-scale-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply exact isolated scale changes
        shell: python
        run: |
          from pathlib import Path

          files = {
              "app/src/main/java/io/github/soclear/oneuix/data/Preference.kt": [
                  ('val fold7DoubleLineClockDateScale: Float = 0.8f',
                   'val fold7DoubleLineClockDateScale: Float = 1f'),
              ],
              "app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt": [
                  ('valueRange = 0.70f..1.10f',
                   'valueRange = 0.50f..1.10f'),
                  ('valueRange = 0.50f..0.90f',
                   'valueRange = 0.50f..1.10f'),
              ],
              "app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt": [
                  ('fold7TimeScale.coerceIn(0.70f, 1.10f)',
                   'fold7TimeScale.coerceIn(0.50f, 1.10f)'),
                  ('fold7DateScale.coerceIn(0.50f, 0.90f)',
                   'fold7DateScale.coerceIn(0.50f, 1.10f)'),
              ],
          }

          for name, replacements in files.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly 1 match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Verify protected customizations are untouched
        shell: bash
        run: |
          test ! -e .github/workflows/import-oneuixpatch-50.yml
          grep -F '0.66f' app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -F 'extraLineGapDp.coerceIn(0f, 2f)' app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -F 'DoubleLineClockGapDp' app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt
          grep -F 'apply_cnlunar_verified.py' .github/workflows/ci.yml

      - name: Show exact diff
        run: git diff --check && git diff -- app/src/main/java/io/github/soclear/oneuix/data/Preference.kt app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/test-fold7-scale-patch.yml
          git add app/src/main/java/io/github/soclear/oneuix/data/Preference.kt \
                  app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt \
                  app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt \
                  .github/workflows/test-fold7-scale-patch.yml
          git commit -m 'test: set Fold7 double-line scales to 0.50-1.10'
          git push
