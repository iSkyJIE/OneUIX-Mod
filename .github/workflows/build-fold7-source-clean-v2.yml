name: Build Fold7 source-clean v2

on:
  push:
    paths:
      - '.github/workflows/build-fold7-source-clean-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify source-clean build has no Fold7 patch step
        run: |
          test -f app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -n 'Fold7 A/B: enlarge the actual status_bar_contents viewport to 74px' app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt

      - name: Rename APK
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OneUIX-Debug-fold7-source-clean-v2-Run${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
          archive: false
