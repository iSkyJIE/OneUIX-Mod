name: Restore MOD clock preview and compact spacing

on:
  push:
    branches: [upstream-180-mod-ci-staging]

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, 'trigger clock preview and gap fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upstream-180-mod-ci-staging
          fetch-depth: 0
      - name: Share actual MOD formatter with app and compact double-line glyph spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import shutil

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          src = Path('hook/src/main/java/io/github/soclear/oneuix/hook/util')
          dst = Path('common/src/main/java/io/github/soclear/oneuix/hook/util')
          dst.mkdir(parents=True, exist_ok=True)
          for name in ('StatusBarClockFormatter.kt', 'TraditionalChineseCalendar.kt'):
              assert (src / name).is_file() and not (dst / name).exists(), name
              shutil.move(str(src / name), str(dst / name))

          ui = Path('app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt')
          s = ui.read_text(encoding='utf-8')
          for old, new in (
              ('import kotlinx.coroutines.launch\n', 'import kotlinx.coroutines.launch\nimport kotlinx.coroutines.delay\n'),
              ('import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\n'),
              ('import io.github.soclear.oneuix.common.Preference\n', 'import io.github.soclear.oneuix.common.Preference\nimport io.github.soclear.oneuix.hook.util.StatusBarClockFormatter\n'),
              ('import java.time.format.DateTimeFormatter\n', ''),
          ):
              if s.count(old) != 1:
                  raise SystemExit(f'Clock UI import changed: {old}')
              s = s.replace(old, new, 1)
          start_marker = '                    var tempDataTimeFormat by remember {'
          end_marker = '                }\n            }\n        }\n        if (\n'
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit('Clock editor structure changed; abort without replacing')
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          if 'customTokens.findAll(tempDataTimeFormat)' not in s[start:end]:
              raise SystemExit('Old preview logic not found; abort')
          replacement = dedent('''\
              var tempDataTimeFormat by remember(uiState.statusBar.statusBarClockFormat) {
                  mutableStateOf(uiState.statusBar.statusBarClockFormat)
              }
              var previewNow by remember { mutableStateOf(LocalDateTime.now()) }
              LaunchedEffect(Unit) {
                  while (true) {
                      previewNow = LocalDateTime.now()
                      delay(1_000L)
                  }
              }
              // Same formatter as SystemUI: expand all MOD tokens when typing or time changes.
              val preview = runCatching {
                  StatusBarClockFormatter.format(tempDataTimeFormat, previewNow)
              }.getOrNull()
              OutlinedTextField(
                  value = tempDataTimeFormat,
                  onValueChange = { tempDataTimeFormat = it },
                  modifier = Modifier.weight(1f),
                  label = { Text(text = stringResource(id = R.string.setStatusBarClockFormat_title)) },
                  supportingText = {
                      Text(
                          text = if (preview == null) {
                              stringResource(id = R.string.clockFormatPreview_invalid)
                          } else {
                              stringResource(id = R.string.clockFormatPreview_result, preview)
                          },
                          maxLines = 4,
                      )
                  },
                  isError = preview == null,
              )
              Spacer(modifier = Modifier.width(8.dp))
              Button(
                  onClick = {
                      if (preview != null) {
                          onEvent(SystemUIEvent.StatusBar.StatusBarClockFormat(tempDataTimeFormat))
                      }
                  },
                  enabled = preview != null,
              ) {
                  Text(text = stringResource(id = R.string.confirm))
              }
          ''')
          replacement = ''.join('                    ' + line if line.strip() else line
                                for line in replacement.splitlines(keepends=True))
          s = s[:start] + replacement + s[end:]
          ui.write_text(s, encoding='utf-8')

          for language, translations in (
              ('values', ('Preview: %1$s', 'Invalid date/time format')),
              ('values-zh', ('实时预览：%1$s', '格式有误，请检查输入')),
          ):
              path = Path(f'app/src/main/res/{language}/strings.xml')
              s = path.read_text(encoding='utf-8')
              if 'clockFormatPreview_result' in s:
                  raise SystemExit('Preview strings already defined')
              marker = '    <string name="setStatusBarClockFormat_title">'
              lines = s.splitlines(keepends=True)
              matches = [i for i, line in enumerate(lines) if line.startswith(marker)]
              if len(matches) != 1:
                  raise SystemExit(f'Expected a single format title in {path}')
              preview, invalid = translations
              lines.insert(matches[0] + 1,
                  f'    <string name="clockFormatPreview_result">{preview}</string>\n'
                  f'    <string name="clockFormatPreview_invalid">{invalid}</string>\n')
              path.write_text(''.join(lines), encoding='utf-8')

          runtime = 'hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarDoubleLineRuntime.kt'
          patch(runtime, 'import android.os.FileObserver\n', 'import android.graphics.Rect\nimport android.os.FileObserver\n')
          patch(runtime, '''        view.setLineSpacing(
              currentStyle.gapDp * view.resources.displayMetrics.density,
              1f,
          )'''.replace('\n  ', '\n'), dedent('''\
                  // Zero extra dp should give compact visible glyph spacing rather than
                  // Android's full ascent/descent leading. Bound the correction to 30%
                  // and scale it to the smaller line to avoid colliding Chinese text.
                  val inkBounds = Rect()
                  view.paint.getTextBounds("国", 0, 1, inkBounds)
                  val metrics = view.paint.fontMetrics
                  val naturalLineHeight = metrics.descent - metrics.ascent
                  val unusedLeading = (naturalLineHeight - inkBounds.height().toFloat())
                      .coerceIn(0f, naturalLineHeight * 0.30f) *
                      minOf(currentStyle.upperScale, currentStyle.lowerScale)
                  view.setLineSpacing(
                      currentStyle.gapDp * view.resources.displayMetrics.density - unusedLeading,
                      1f,
                  )
          ''').replace('\n', '\n        ').rstrip())

          test = Path('common/src/test/java/io/github/soclear/oneuix/hook/util/StatusBarClockFormatterTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          if test.exists():
              raise SystemExit('Formatter test already exists')
          test.write_text(dedent('''\
              package io.github.soclear.oneuix.hook.util

              import java.time.LocalDateTime
              import org.junit.Assert.assertFalse
              import org.junit.Assert.assertTrue
              import org.junit.Test

              class StatusBarClockFormatterTest {
                  @Test fun expandsEveryModTokenAndKeepsDoubleLine() {
                      val pattern = "HH:mm\\nCNLUNAR CNPERIOD CNTIME CNYEAR CNZODIAC CNSEASON"
                      val result = StatusBarClockFormatter.format(pattern, LocalDateTime.of(2026, 9, 22, 12, 34))
                      assertTrue(result.startsWith("12:34\\n"))
                      assertTrue(result.contains("中午"))
                      assertTrue(result.contains("午时"))
                      assertTrue(result.contains("秋"))
                      for (token in listOf("CNLUNAR", "CNPERIOD", "CNTIME", "CNYEAR", "CNZODIAC", "CNSEASON")) {
                          assertFalse(result.contains(token))
                      }
                  }

                  @Test fun repeatedTokensExpandAndNormalPatternsStillWork() {
                      val date = LocalDateTime.of(2026, 9, 22, 23, 0)
                      assertTrue(StatusBarClockFormatter.format("CNTIME / CNTIME", date) == "子时 / 子时")
                      assertTrue(StatusBarClockFormatter.format("HH:mm", date) == "23:00")
                  }
              }
          '''), encoding='utf-8')
          print('Formatter shared, live preview and compact gap updated; tests written.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(staging): live lunar time preview and compact double-line gap'
          git push origin HEAD:upstream-180-mod-ci-staging
