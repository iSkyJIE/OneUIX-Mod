name: Refine MOD clock text layout
on:
  push:
    paths:
      - '.github/workflows/mod-clock-text-layout-v2.yml'
permissions:
  contents: write
jobs:
  refine:
    if: github.ref_name == 'upstream-180-mod-ci-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Apply verified clock layout patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          a = s.index('                // Restore the original single-line behavior when a custom format changes.')
          b = s.index('                clockTextView?.text = dateTime', a)
          old = s[a:b]
          assert old.count('setSingleLine(false)') == 1 and old.count('setSingleLine(true)') == 1
          new = '''                // Match the MOD two-line text behavior while preserving the upstream single-line path.
                clockTextView?.apply {
                    if (dateTime.indexOf(10.toChar()) >= 0) {
                        setSingleLine(false)
                        maxLines = 2
                        minLines = 2
                        includeFontPadding = false
                        ellipsize = null
                        setHorizontallyScrolling(false)
                    } else {
                        setSingleLine(true)
                        maxLines = 1
                        minLines = 1
                        includeFontPadding = true
                        setLineSpacing(0f, 1f)
                    }
                }
          '''
          s = s[:a] + new + s[b:]
          old_desc = '                clockTextView?.contentDescription = dateTime'
          assert s.count(old_desc) == 1
          s = s.replace(old_desc, "                clockTextView?.contentDescription = dateTime.replace(10.toChar(), ' ')", 1)
          p.write_text(s)
          PY
          git diff --check
          git add hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(systemui): refine MOD two-line clock layout and accessibility'
          git push