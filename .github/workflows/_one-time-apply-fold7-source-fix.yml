name: One-time apply Fold7 source fix

on:
  push:
    paths:
      - '.github/workflows/_one-time-apply-fold7-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified Fold7 A-B source fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          old = '''    private fun applyStatusBarVerticalOffset(statusBarView: View) {\n        val offset = statusBarVerticalOffset'''
          new = '''    private fun applyStatusBarVerticalOffset(statusBarView: View) {\n        // Fold7 A/B: enlarge the actual status_bar_contents viewport to 74px.\n        if (Build.MODEL.startsWith("SM-F966", ignoreCase = true)) {\n            statusBarView.findStatusBarArea("status_bar_contents")?.let { contents ->\n                contents.layoutParams = contents.layoutParams.apply { height = 74 }\n                contents.requestLayout()\n            }\n        }\n        val offset = statusBarVerticalOffset'''
          if s.count(old) != 1: raise SystemExit(f'applyStatusBarVerticalOffset anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          old_h = 'params.height = ViewGroup.LayoutParams.MATCH_PARENT'
          if s.count(old_h) != 1: raise SystemExit(f'clock height anchor count={s.count(old_h)}')
          s = s.replace(old_h, 'params.height = 74', 1)
          old_t = 'clockTextView.translationY = doubleLineClockStyle.opticalTranslationYDp * density'
          if s.count(old_t) != 1: raise SystemExit(f'clock translation anchor count={s.count(old_t)}')
          s = s.replace(old_t, 'clockTextView.translationY = 0f', 1)
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          git diff --cached --check
          git commit -m 'fix: persist verified Fold7 double-line viewport fix'
          git push
