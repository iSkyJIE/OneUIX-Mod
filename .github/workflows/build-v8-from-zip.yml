name: Build V8 From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/OneUIX-anndy999-v8-presets-source.zip'
      - '.github/workflows/build-v8-from-zip.yml'

permissions:
  contents: write

concurrency:
  group: oneuix-v8-from-zip
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Extract V8 source
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q ".github/workflows/OneUIX-anndy999-v8-presets-source.zip" -d buildsrc
          test -f "buildsrc/OneUIX-patch-main/gradlew"
          echo "V8 source extracted successfully"

      - name: Build APK
        shell: bash
        working-directory: buildsrc/OneUIX-patch-main
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp "buildsrc/OneUIX-patch-main/app/build/outputs/apk/debug/app-debug.apk"              "dist/OneUIX-anndy999-v8-presets.apk"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v8.0.${GITHUB_RUN_NUMBER}"
          APK="dist/OneUIX-anndy999-v8-presets.apk"

          gh release create "$TAG" "$APK"             --target "$GITHUB_SHA"             --title "OneUIX anndy999 V8 Presets"             --notes "V8: Samsung status-bar double-line clock with five selectable size presets, adjusted line spacing, and optimized vertical alignment."

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneUIX-anndy999-v8-presets
          path: dist/OneUIX-anndy999-v8-presets.apk
          retention-days: 7
