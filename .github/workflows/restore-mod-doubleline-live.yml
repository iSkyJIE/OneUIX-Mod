name: Restore MOD double-line live refresh

on:
  push:
    branches: [upstream-180-mod-ci-staging]

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, 'stage double-line live refresh')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upstream-180-mod-ci-staging
          fetch-depth: 0
      - name: Restore live double-line clock style refresh
        run: |
          cat > hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarDoubleLineRuntime.kt <<'EOF'
          package io.github.soclear.oneuix.hook.systemui

          import android.os.FileObserver
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.RelativeSizeSpan
          import android.widget.TextView
          import io.github.libxposed.api.XposedModule
          import io.github.soclear.oneuix.common.DoubleLineClockSettings
          import io.github.soclear.oneuix.common.Preference
          import io.github.soclear.oneuix.hook.util.PreferenceProvider
          import io.github.soclear.oneuix.hook.util.xlog
          import java.io.File
          import java.util.WeakHashMap

          /** Keeps MOD double-line clock size/gap controls live without restarting SystemUI. */
          object StatusBarDoubleLineRuntime {
              private data class Style(
                  val upperScale: Float,
                  val lowerScale: Float,
                  val gapDp: Float,
              )

              @Volatile
              private var style = Style(1f, 1f, 0f)
              private val activeViews = WeakHashMap<TextView, Unit>()
              private var preferenceObserver: FileObserver? = null

              private fun resolveStyle(
                  preset: String,
                  gapDp: Float,
                  independent: Boolean,
                  upperScale: Float,
                  lowerScale: Float,
              ): Style {
                  val presetScale = DoubleLineClockSettings.presetScale(preset)
                  return Style(
                      upperScale = if (independent) {
                          DoubleLineClockSettings.timeScale(upperScale)
                      } else presetScale,
                      lowerScale = if (independent) {
                          DoubleLineClockSettings.dateScale(lowerScale)
                      } else presetScale,
                      gapDp = DoubleLineClockSettings.lineGapDp(gapDp),
                  )
              }

              private fun update(
                  preset: String,
                  gapDp: Float,
                  independent: Boolean,
                  upperScale: Float,
                  lowerScale: Float,
              ) {
                  style = resolveStyle(preset, gapDp, independent, upperScale, lowerScale)
                  val views = synchronized(activeViews) { activeViews.keys.toList() }
                  views.forEach { view ->
                      view.post {
                          val currentText = view.text?.toString() ?: return@post
                          if (currentText.contains('\n')) apply(view, currentText)
                      }
                  }
              }

              fun apply(view: TextView, dateTime: String) {
                  synchronized(activeViews) { activeViews[view] = Unit }
                  val lineBreak = dateTime.indexOf('\n')
                  if (lineBreak < 0) return
                  val currentStyle = style

                  view.setSingleLine(false)
                  view.maxLines = 2
                  view.minLines = 2
                  view.includeFontPadding = false
                  view.ellipsize = null
                  view.setHorizontallyScrolling(false)
                  view.setLineSpacing(
                      currentStyle.gapDp * view.resources.displayMetrics.density,
                      1f,
                  )

                  val styledText = SpannableString(dateTime)
                  if (lineBreak > 0) {
                      styledText.setSpan(
                          RelativeSizeSpan(currentStyle.upperScale),
                          0,
                          lineBreak,
                          Spanned.SPAN_EXCLUSIVE_EXCLUSIVE,
                      )
                  }
                  if (lineBreak + 1 < styledText.length) {
                      styledText.setSpan(
                          RelativeSizeSpan(currentStyle.lowerScale),
                          lineBreak + 1,
                          styledText.length,
                          Spanned.SPAN_EXCLUSIVE_EXCLUSIVE,
                      )
                  }
                  view.text = styledText
                  view.contentDescription = dateTime.replace('\n', ' ')
                  view.requestLayout()
                  view.invalidate()
              }

              fun unregister(view: TextView) {
                  synchronized(activeViews) { activeViews.remove(view) }
              }

              context(xposedModule: XposedModule)
              private fun watchRemotePreference() {
                  if (preferenceObserver != null) return
                  try {
                      val descriptor = xposedModule.openRemoteFile(Preference.FILE_NAME)
                      try {
                          val path = File("/proc/self/fd/${descriptor.fd}")
                          val watcher = object : FileObserver(path, FileObserver.CLOSE_WRITE) {
                              override fun onEvent(event: Int, changedPath: String?) {
                                  if (event and FileObserver.CLOSE_WRITE == 0) return
                                  val statusBar = with(xposedModule) {
                                      PreferenceProvider.loadPreference()
                                  }?.systemUI?.statusBar ?: return
                                  if (!statusBar.setStatusBarClockFormat ||
                                      !statusBar.statusBarClockFormat.contains('\n')) return
                                  val preset = statusBar.statusBarDoubleLineClockSize.ifBlank {
                                      DoubleLineClockSettings.fromLegacyScale(
                                          statusBar.statusBarClockTextScale
                                      )
                                  }
                                  update(
                                      preset = preset,
                                      gapDp = statusBar.doubleLineClockGapDp,
                                      independent = statusBar.useFold7CustomDoubleLineClockScale,
                                      upperScale = statusBar.fold7DoubleLineClockTimeScale,
                                      lowerScale = statusBar.fold7DoubleLineClockDateScale,
                                  )
                              }
                          }
                          watcher.startWatching()
                          preferenceObserver = watcher
                      } finally {
                          descriptor.close()
                      }
                  } catch (t: Throwable) {
                      xlog(t)
                  }
              }

              context(xposedModule: XposedModule)
              fun install(
                  preset: String,
                  gapDp: Float,
                  independent: Boolean,
                  upperScale: Float,
                  lowerScale: Float,
              ) {
                  update(preset, gapDp, independent, upperScale, lowerScale)
                  watchRemotePreference()
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt')
          s = p.read_text()
          old = '''        val presetScale = DoubleLineClockSettings.presetScale(doubleLinePreset)
                  val upperScale = if (useIndependentDoubleLineScale) {
                      DoubleLineClockSettings.timeScale(upperLineScale)
                  } else {
                      presetScale
                  }
                  val lowerScale = if (useIndependentDoubleLineScale) {
                      DoubleLineClockSettings.dateScale(lowerLineScale)
                  } else {
                      presetScale
                  }
                  val lineGapDp = DoubleLineClockSettings.lineGapDp(doubleLineGapDp)
          
                  setStatusBarClockText(
                      block = { StatusBarClockFormatSupport.format(format) },
                      upperLineScale = upperScale,
                      lowerLineScale = lowerScale,
                      lineGapDp = lineGapDp,
                  )'''
          new = '''        StatusBarDoubleLineRuntime.install(
                      preset = doubleLinePreset,
                      gapDp = doubleLineGapDp,
                      independent = useIndependentDoubleLineScale,
                      upperScale = upperLineScale,
                      lowerScale = lowerLineScale,
                  )
          
                  setStatusBarClockText(
                      block = { StatusBarClockFormatSupport.format(format) },
                  )'''
          if old not in s:
              raise SystemExit('clock setup block not found')
          s = s.replace(old, new, 1)
          old_sig = '''    private fun setStatusBarClockText(
                  block: () -> String,
                  upperLineScale: Float = 1f,
                  lowerLineScale: Float = 1f,
                  lineGapDp: Float = 0f,
              ) = afterAttach {'''
          new_sig = '''    private fun setStatusBarClockText(
                  block: () -> String,
              ) = afterAttach {'''
          if old_sig not in s:
              raise SystemExit('clock helper signature not found')
          s = s.replace(old_sig, new_sig, 1)
          old_double = '''                        setSingleLine(false)
                                  maxLines = 2
                                  minLines = 2
                                  includeFontPadding = false
                                  ellipsize = null
                                  setHorizontallyScrolling(false)
                                  setLineSpacing(lineGapDp * resources.displayMetrics.density, 1f)
          
                                  val styledText = SpannableString(dateTime)
                                  if (lineBreak > 0) {
                                      styledText.setSpan(
                                          RelativeSizeSpan(upperLineScale),
                                          0,
                                          lineBreak,
                                          Spanned.SPAN_EXCLUSIVE_EXCLUSIVE,
                                      )
                                  }
                                  if (lineBreak + 1 < styledText.length) {
                                      styledText.setSpan(
                                          RelativeSizeSpan(lowerLineScale),
                                          lineBreak + 1,
                                          styledText.length,
                                          Spanned.SPAN_EXCLUSIVE_EXCLUSIVE,
                                      )
                                  }
                                  text = styledText'''
          new_double = '''                        StatusBarDoubleLineRuntime.apply(this, dateTime)'''
          if old_double not in s:
              raise SystemExit('double-line render block not found')
          s = s.replace(old_double, new_double, 1)
          old_single = '''                    } else {
                                  setSingleLine(true)'''
          new_single = '''                    } else {
                                  StatusBarDoubleLineRuntime.unregister(this)
                                  setSingleLine(true)'''
          if old_single not in s:
              raise SystemExit('single-line restore block not found')
          s = s.replace(old_single, new_single, 1)
          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarDoubleLineRuntime.kt
          git commit -m "fix(staging): restore live MOD double-line clock controls"
          git push origin HEAD:upstream-180-mod-ci-staging
