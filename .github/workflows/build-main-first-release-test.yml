name: Build isolated production-signed release test

on:
  push:
    branches:
      - upgrade/from-main-upstream-180-20260922
    paths:
      - .github/workflows/build-main-first-release-test.yml
      - app/src/**
      - common/src/**
      - hook/src/**
      - app/build.gradle.kts
      - common/build.gradle.kts
      - hook/build.gradle.kts
      - gradle.properties

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Check main and upstream provenance and original app identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 92312ebcfe7ab36cf18a55e90af8a0f5dfebb314 HEAD
          git merge-base --is-ancestor 8c67e23118a91b3defd04147b88f32be689e24b1 HEAD
          grep -Fx 'oneuix.applicationId=io.github.mod.oneuix' gradle.properties
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/iSkyJIE/OneUIX-Mod/releases/download/v1.0.0/OneUIX-Mod_v1.0.0.apk \
            --output production.apk
          test -s production.apk
      - name: Install existing MOD signing identity and run test plus release build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :common:testDebugUnitTest assembleRelease --no-daemon
      - name: Require APK certificate match and higher upgrade version
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          MAIN_CERT=$("$APKSIGNER" verify --print-certs production.apk | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          test -n "$MAIN_CERT"
          test "$MAIN_CERT" = "$NEW_CERT"
          OLD_BADGING=$("$AAPT" dump badging production.apk | head -n 1)
          NEW_BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$OLD_BADGING"
          echo "$NEW_BADGING"
          echo "$NEW_BADGING" | grep -F "name='io.github.mod.oneuix'"
          OLD_VERSION=$(printf '%s' "$OLD_BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NEW_VERSION=$(printf '%s' "$NEW_BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          test -n "$OLD_VERSION"
          test -n "$NEW_VERSION"
          test "$NEW_VERSION" -gt "$OLD_VERSION"
          echo 'Official MOD release cert, app identity and upgrade version verified.'
          cp "$APK" app/build/outputs/apk/release/OneUIX-Mod-1.8.0-main-derived-TEST.apk
      - name: Upload nonpublished release-mode test APK
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-Mod-1.8.0-main-derived-PRODUCTION-SIGNED-TEST
          path: app/build/outputs/apk/release/OneUIX-Mod-1.8.0-main-derived-TEST.apk
          retention-days: 7
          archive: false
