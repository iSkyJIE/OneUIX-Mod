name: Build isolated production-signed release test

# Test branch only: this workflow uploads a QA artifact; it never publishes a Release.
on:
  push:
    branches:
      - upgrade/from-main-upstream-180-20260922
    paths:
      - .github/workflows/build-main-first-release-test.yml
      - .github/workflows/release.yml
      - app/build.gradle.kts
      - app/src/main/res/**
      - app/src/main/java/**
      - app/src/test/**
      - common/src/main/**
      - hook/src/main/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Check official MOD main, version and every translated app name
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 92312ebcfe7ab36cf18a55e90af8a0f5dfebb314 HEAD
          git merge-base --is-ancestor 8c67e23118a91b3defd04147b88f32be689e24b1 HEAD
          grep -Fx 'oneuix.applicationId=io.github.mod.oneuix' gradle.properties
          grep -Fx '        versionCode = 11' app/build.gradle.kts
          grep -Fx '        versionName = "1.1.0"' app/build.gradle.kts
          for resource in app/src/main/res/values{,-zh,-fr,-ru,-ko}/strings.xml; do
            grep -F '<string name="app_name">OneUIX MOD</string>' "$resource"
          done
          grep -F 'types: [created]' .github/workflows/release.yml
          grep -F 'softprops/action-gh-release@v2' .github/workflows/release.yml
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/iSkyJIE/OneUIX-Mod/releases/download/v1.0.0/OneUIX-Mod_v1.0.0.apk \
            --output production.apk
          test -s production.apk
      - name: Install existing MOD signing identity and run tests plus release build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :common:testDebugUnitTest assembleRelease --no-daemon
      - name: Require MOD release certificate, branding and exact upgrade version
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          MAIN_CERT=$("$APKSIGNER" verify --print-certs production.apk | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          test -n "$MAIN_CERT"
          test "$MAIN_CERT" = "$NEW_CERT"
          test "$NEW_CERT" = '3cca67360758a4956796fcf6d8c726daf92b581532a1bb7e81211c8107bc7e09'
          OLD_BADGING=$("$AAPT" dump badging production.apk | head -n 1)
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | head -n 1 | grep -F "name='io.github.mod.oneuix' versionCode='11' versionName='1.1.0'"
          echo "$BADGING" | grep -F "application-label:'OneUIX MOD'"
          for locale in zh fr ko ru; do
            echo "$BADGING" | grep -F "application-label-${locale}:'OneUIX MOD'"
          done
          OLD_VERSION=$(printf '%s' "$OLD_BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          test "$OLD_VERSION" = '1'
          test 11 -gt 10
          echo 'MOD v1.1.0 release identity, locale labels, original signature and previous-test upgrade path verified.'
          cp "$APK" app/build/outputs/apk/release/OneUIX-Mod_v1.1.0_TEST.apk
      - name: Upload nonpublished release-mode test APK
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-Mod_v1.1.0_SIGNED_TEST
          path: app/build/outputs/apk/release/OneUIX-Mod_v1.1.0_TEST.apk
          retention-days: 7
          archive: false
